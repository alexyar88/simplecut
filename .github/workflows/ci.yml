name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve dependencies
        run: swift package resolve
      - name: Validate app metadata
        run: plutil -lint Resources/Info.plist Resources/SimpleCut.entitlements
      - name: Build
        run: swift build
      - name: Test
        run: swift test
